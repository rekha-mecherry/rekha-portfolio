<div class="fixed bottom-6 right-6 z-50 flex flex-col items-end">

    <!-- Chat Window -->
    <div *ngIf="isOpen"
        class="w-80 h-96 bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl mb-4 flex flex-col overflow-hidden animate-fade-in">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-4 flex justify-between items-center text-white">
            <div class="font-bold flex items-center gap-2">
                <span>✨</span> AI Assistant
            </div>
            <button (click)="toggleChat()" class="hover:bg-white/20 rounded-full p-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Messages -->
        <div class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-900/50">
            <div *ngFor="let msg of messages"
                [ngClass]="{'self-end bg-blue-600 text-white ml-8': msg.sender === 'user', 'self-start bg-slate-700 text-slate-200 mr-8': msg.sender === 'bot'}"
                class="p-3 rounded-2xl text-sm max-w-[85%] animate-fade-in">
                {{ msg.text }}
            </div>
            <div *ngIf="isLoading" class="text-slate-500 text-xs ml-2">Taking a moment...</div>
        </div>

        <!-- Input -->
        <div class="p-3 bg-slate-800 border-t border-slate-700 flex gap-2">
            <input [(ngModel)]="userInput" (keyup.enter)="sendMessage()" type="text"
                placeholder="Ask about Azure, Temi..."
                class="flex-1 bg-slate-900 border border-slate-700 rounded-full px-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            <button (click)="sendMessage()" class="bg-blue-600 hover:bg-blue-500 text-white rounded-full p-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Toggle Button -->
    <button *ngIf="!isOpen" (click)="toggleChat()"
        class="bg-gradient-to-r from-blue-600 to-purple-600 w-14 h-14 rounded-full flex items-center justify-center shadow-lg hover:scale-105 transition-transform">
        <span class="text-2xl">💬</span>
    </button>
</div>
