<section id="education" class="py-20 bg-slate-900">
  <div class="container">
    <h2 class="text-3xl font-bold mb-3 text-center">Education & Certifications</h2>
    <p class="text-center text-slate-500 mb-16 text-sm tracking-widest uppercase">Academic Background · Professional Credentials</p>

    <div class="flex flex-col lg:flex-row gap-10">

      <!-- Education -->
      <div class="lg:w-1/3">
        <h3 class="text-xl font-bold mb-6 flex items-center gap-3">
          <span class="w-6 h-1 bg-blue-400 rounded-full"></span>
          Academic
        </h3>
        <div *ngFor="let edu of education"
          class="glass-panel p-6 border border-blue-500/30 hover:border-blue-400/50 transition-all duration-300">
          <div class="flex items-start gap-4">
            <span class="text-4xl">{{ edu.icon }}</span>
            <div>
              <h4 class="font-bold text-white text-lg leading-tight mb-1">{{ edu.degree }}</h4>
              <p class="text-blue-400 font-medium text-sm">{{ edu.institution }}</p>
              <p class="text-slate-500 text-xs mt-1">{{ edu.location }}</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Certifications -->
      <div class="flex-1">
        <h3 class="text-xl font-bold mb-6 flex items-center gap-3">
          <span class="w-6 h-1 bg-yellow-400 rounded-full"></span>
          Certifications
        </h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div *ngFor="let cert of certifications"
            class="glass-panel p-4 border border-slate-700/40 hover:border-yellow-500/30 transition-all duration-300 flex items-center gap-3">
            <span class="text-2xl flex-shrink-0" [ngClass]="cert.color">{{ cert.icon }}</span>
            <p class="text-slate-300 text-sm leading-snug font-medium">{{ cert.name }}</p>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
